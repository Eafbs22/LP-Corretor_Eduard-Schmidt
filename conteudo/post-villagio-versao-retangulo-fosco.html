<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Villagio Salomão - versão retângulo fosco</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #dfe7e5; }
    body { font-family: 'Trebuchet MS', Arial, sans-serif; }
    .post-card {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      background: #f4f5f0;
    }
    .aerial {
      position: absolute;
      inset: 0 0 auto;
      width: 100%;
      height: 760px;
      object-fit: cover;
      object-position: center;
      filter: saturate(.94) contrast(1.04);
    }
    .aerial::after { display: none; }
    .top-shade {
      position: absolute;
      inset: 0 0 auto;
      height: 760px;
      background: linear-gradient(180deg, rgba(12,49,35,.22), transparent 42%, rgba(12,49,35,.58));
    }
    .tag, .title, .location {
      position: absolute;
      z-index: 2;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 24px rgba(12,49,35,.14);
    }
    .tag {
      top: 58px;
      left: 72px;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 4px;
      background: rgba(255,255,255,.58);
      color: #174b35;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .title {
      top: 338px;
      left: 72px;
      padding: 10px 20px 16px;
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(255,255,255,.62);
      color: #125238;
      font-size: 88px;
      line-height: .9;
      font-weight: 900;
      text-transform: uppercase;
    }
    .location {
      top: 580px;
      left: 72px;
      padding: 12px 18px;
      border-top: 1px solid rgba(255,255,255,.24);
      border-bottom: 1px solid rgba(255,255,255,.18);
      border-left: 8px solid #8abf8b;
      background: rgba(23,75,53,.72);
      color: #fff;
      font-size: 27px;
      font-weight: 700;
    }
    .propaganda {
      position: absolute;
      inset: 760px 0 0;
      overflow: hidden;
      background: #edf3ec;
    }
    .propaganda img {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 1080px;
      height: 590px;
      object-fit: cover;
      object-position: center top;
      opacity: .96;
    }
    .propaganda::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(248,250,247,.18), rgba(23,75,53,.05) 65%, rgba(23,75,53,.2));
    }
    .information {
      position: absolute;
      z-index: 4;
      left: 58px;
      bottom: 34px;
      width: 650px;
      height: 132px;
      padding: 14px 28px 12px 32px;
      border: 1px solid rgba(255,255,255,.62);
      border-left: 8px solid #2f7350;
      background: rgba(248,250,247,.48);
      box-shadow: 0 16px 40px rgba(12,49,35,.11);
      backdrop-filter: blur(9px);
    }
    .information h2 {
      margin-bottom: 5px;
      color: #174b35;
      font-size: 24px;
      line-height: 1.05;
    }
    .information p {
      color: #3e6650;
      font-size: 16px;
      line-height: 1.3;
    }
    .portrait {
      position: absolute;
      z-index: 5;
      top: 520px;
      right: 64px;
      width: 300px;
      height: 390px;
      padding: 14px;
      object-fit: cover;
      object-position: center top;
      border: 1px solid rgba(255,255,255,.92);
      background: rgba(255,255,255,.64);
      box-shadow: 0 18px 42px rgba(12,49,35,.28), 10px 10px 0 rgba(47,115,80,.62);
    }
    .signature {
      position: absolute;
      z-index: 6;
      top: 820px;
      right: 86px;
      width: 272px;
      padding: 13px 14px;
      background: rgba(23,75,53,.92);
      color: #fff;
      font-size: 17px;
      line-height: 1.2;
      text-align: center;
    }
    .signature strong {
      display: block;
      margin-bottom: 4px;
      color: #b9d9b3;
      font-size: 21px;
    }
  </style>
</head>
<body>
  <main class="post-card">
    <img class="aerial" src="Fotos Profissional/Villagio_Aéreo.jpg" alt="Vista aérea do Villagio Salomão" />
    <div class="top-shade"></div>
    <div class="tag">Um novo lugar em São José</div>
    <h1 class="title">Villagio<br />Salomão</h1>
    <div class="location">Forquilhas — São José, SC</div>
    <div class="propaganda">
      <img src="Fotos Profissional/Villagio_Propaganda.jpeg" alt="Imagem do Villagio Salomão" />
    </div>
    <section class="information">
      <h2>Um novo capítulo para Forquilhas.</h2>
      <p>Um empreendimento que transforma a paisagem e a forma de viver São José.</p>
    </section>
    <img class="portrait" src="Fotos Profissional/Gemini_Generated_Image_klujbpklujbpkluj.png" alt="Retrato de Eduard Schmidt" />
    <div class="signature"><strong>Eduard Schmidt</strong>Apresentação do projeto</div>
  </main>
</body>
</html>
